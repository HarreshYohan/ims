version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ims}
      POSTGRES_DB: ${POSTGRES_DB:-ims}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nodeapp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:${APP_PORT:-8083}"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: "npm run dev"

  analytics:
    build:
      context: ../analytics
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../analytics/.env
    volumes:
      - ../analytics:/app
    environment:
      POSTGRES_HOST: postgres
      PYTHONUNBUFFERED: 1

volumes:
  postgres_data:

